name: Keep API warm

# El plan gratuito de Render duerme el servicio tras ~15 min sin tráfico y el
# siguiente clic tarda ~50 s en despertarlo. Este ping cada 10 minutos lo
# mantiene despierto (y de paso mantiene caliente la base de datos de Neon).
#
# Solo en horario activo (06:00-22:00 UTC ≈ 07:00-23:00 en Canarias) para no
# agotar las 750 horas/mes de instancia del plan gratuito.
#
# DESACTIVADO (2026-08-07): el keepalive lo lleva ahora un monitor externo
# (cron-job.org), que además solo avisa si la API está REALMENTE caída, sin los
# falsos fallos de "job was not acquired by Runner" de los runners gratuitos de
# GitHub. Se quita el disparador por horario y se deja solo el manual
# (workflow_dispatch): el workflow no se ejecuta solo, pero sigue aquí por si
# hubiera que reactivarlo (basta devolver el bloque `schedule`).
on:
  workflow_dispatch: {}

# Si un ping se solapa con el siguiente, se cancela el viejo en vez de acumular.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Un ping no debería tardar más de un par de minutos ni con arranque en frío.
    timeout-minutes: 5
    steps:
      - name: Ping API (health + una consulta a BD), con reintentos
        run: |
          set -u
          # El servicio puede estar arrancando en frío (502/503 durante ~50 s).
          # Reintentar con espera evita marcar como fallo lo que solo es un
          # despertar lento. --retry cubre errores de conexión y 5xx.
          espera() {
            curl -fsS -m 60 --retry 5 --retry-delay 15 --retry-all-errors "$1" > /dev/null
          }
          espera https://grancanaria-rcp-api.onrender.com/api/health
          espera https://grancanaria-rcp-api.onrender.com/api/public/courses
          echo "API despierta"
